<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>試薬作成計算ソフト</title><link rel="stylesheet" href="style.css"></head>
<body>
<main>
  <header><span class="tag">REAGENT PREPARATION</span><h1>試薬作成計算ソフト</h1><p>ストック濃度と目標の組成から、必要な分注量を計算します。</p></header>
  <section><h2>1. 作成する溶液</h2><div class="settings"><label>溶液名<input id="recipe-name" placeholder="例：作業用バッファー"></label><label>最終容量<input id="total" type="number" min="0" step="any" value="100"></label><label>容量の単位<select id="volume-unit"><option>mL</option><option>µL</option><option>L</option></select></label><label>溶媒名<input id="solvent" value="精製水"></label></div></section>
  <section><div class="section-title"><h2>2. ストックと最終組成</h2><button id="add" type="button">＋ 試薬を追加</button></div><p class="hint">モル濃度・質量濃度・体積百分率・倍率に対応。同じ種類の単位間で換算します。</p><div class="table-wrap"><table><thead><tr><th>試薬名</th><th>ストック濃度</th><th>単位</th><th>最終濃度</th><th>単位</th><th><span class="sr-only">削除</span></th></tr></thead><tbody id="rows"></tbody></table></div><button id="calculate" class="primary" type="button">必要量を計算</button><p id="error" role="alert"></p></section>
  <section id="result" hidden aria-live="polite"><h2>3. 調製レシピ</h2><div id="result-content"></div><p class="hint">各ストックを加え、溶媒で最終容量に定容してください。溶媒量は体積の加算を仮定した目安です。混合順序・溶解性・反応性は別途確認してください。</p><button id="print" type="button">レシピを印刷 / PDF保存</button></section>
  <footer><p>計算式：ストック量 = 最終濃度 × 最終容量 ÷ ストック濃度</p><p>入力内容はこのブラウザに自動保存されます。外部への送信はありません。</p><button id="export" type="button">入力をファイルに保存</button> <label class="import">保存した入力を開く<input id="import" type="file" accept="application/json,.json"></label><p id="storage-status" role="status"></p></footer>
</main><script src="calculator.js"></script><script src="app.js"></script>
</body></html>
