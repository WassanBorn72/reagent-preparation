name: Build desktop applications
on:
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            command: build:win
            artifact: windows
            pattern: dist/*.exe
          - os: macos-latest
            command: build:mac
            artifact: macos
            pattern: dist/*.dmg
          - os: ubuntu-latest
            command: build:linux
            artifact: linux
            pattern: dist/*.AppImage
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run ${{ matrix.command }} -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: reagent-calculator-${{ matrix.artifact }}
          path: ${{ matrix.pattern }}
          if-no-files-found: error
